<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>EPOS — rendu</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="personnage.js"></script>
<script>
window.__rendu = function (nom, L, H, transparent) {
  const scene = new THREE.Scene();
  const renderer = creerRendu(L, H, transparent);
  const constructeur = SCENES[nom];
  if (!constructeur) throw new Error('scène inconnue : ' + nom);
  const cam = constructeur(scene, renderer, L, H);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
// Rendu d'une image du personnage, fond transparent.
window.__perso = function (L, H, direction, phase, repos) {
  const scene = new THREE.Scene();
  const renderer = creerRendu(L, H, true);
  bancPersonnage(scene);
  const p = pharmacien(window.__variante || {});
  poserPharmacien(p, phase, repos);
  // orientation : 0 = face, 1 = dos, 2 = gauche, 3 = droite
  const angles = { bas: 0, haut: Math.PI, gauche: -Math.PI / 2, droite: Math.PI / 2 };
  p.rotation.y = angles[direction] === undefined ? 0 : angles[direction];
  scene.add(p);
  // le personnage mesure environ 2,1 unités : on cadre avec ~10 % de marge
  const cam = new THREE.PerspectiveCamera(26, L / H, 0.1, 40);
  cam.position.set(0, 1.05, 5.65);
  cam.lookAt(0, 1.05, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
// Pose « présentation » : la pharmacienne s'adresse au joueur.
window.__presente = function (L, H, phase, feminin) {
  const scene = new THREE.Scene();
  const renderer = creerRendu(L, H, true);
  bancPersonnage(scene);
  // le personnage qui accueille est celui que l'etudiant a choisi : les
  // deux variantes sont rendues, la diapositive designe la bonne
  const p = pharmacien(feminin === false
    ? { cheveux: 0x2B2019, chemise: 0x0E7C8C, pantalon: 0x23394E }
    : { feminin: true, cheveux: 0x4A2F22, chemise: 0x6D5FE0, pantalon: 0x1C3348 });
  const u = p.userData;
  const a = phase * Math.PI * 2;
  poserPharmacien(p, 0, true);
  // geste d'explication : l'avant-bras s'ouvre vers le joueur, paume
  // offerte. Une rotation z négative ramenait la main devant la poitrine.
  u.brasD.rotation.x = -0.42 - Math.sin(a) * 0.12;
  u.brasD.rotation.z = 0.26 + Math.sin(a) * 0.05;
  u.brasD.userData.coude.rotation.x = -0.95 - Math.cos(a) * 0.16;
  u.brasD.userData.coude.rotation.z = -0.2;
  u.brasG.rotation.x = 0.14 + Math.sin(a) * 0.04;
  u.brasG.rotation.z = 0.07;
  u.brasG.userData.coude.rotation.x = -0.38;
  u.tete.rotation.y = 0.06 + Math.sin(a) * 0.07;
  u.tete.rotation.x = Math.sin(a * 2 + 1) * 0.03;
  u.torse.rotation.y = 0.1 + Math.sin(a) * 0.03;
  p.rotation.y = -0.2;
  scene.add(p);
  const cam = new THREE.PerspectiveCamera(26, L / H, 0.1, 40);
  cam.position.set(0, 1.05, 5.65);
  cam.lookAt(0, 1.05, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.__pret = true;
</script>
</body></html>
